[package]
name = "kernel"
description = "Modular monolithic kernel (x86_64, UEFI via bootloader 0.11): serial diagnostics, exception handling, memory management, 8259/PIT interrupts, PS/2 input, interactive framebuffer screen, preemptive threads and isolated ring-3 processes."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "kernel"
test = false
bench = false

[features]
desktop = []
# Fault-test builds used only by `cargo xtask smoke`; never enable them
# otherwise. Each adds a deliberate failure at the end of boot:
# panic right after the welcome screen is drawn,
deliberate-panic = []
# write into an unmapped guard page (page fault),
deliberate-page-fault = []
# recurse until the boot stack overflows into its guard page (double fault).
deliberate-stack-overflow = []
# fault inside the timer interrupt handler while the event loop runs.
deliberate-interrupt-fault = []

[dependencies]
bootloader_api.workspace = true
os-abi.workspace = true
gfx.workspace = true
boot-data.workspace = true
mm.workspace = true
input.workspace = true
exec.workspace = true
storage.workspace = true

[lints]
workspace = true
