[package]
name = "kernel"
description = "Modular monolithic kernel (x86_64, UEFI via bootloader 0.11): serial diagnostics, exception handling, memory management, framebuffer welcome screen."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "kernel"
test = false
bench = false

[features]
# Fault-test builds used only by `cargo xtask smoke`; never enable them
# otherwise. Each replaces the final "BOOT OK" with a deliberate failure:
# panic right after the welcome screen is drawn,
deliberate-panic = []
# write into an unmapped guard page (page fault),
deliberate-page-fault = []
# recurse until the boot stack overflows into its guard page (double fault).
deliberate-stack-overflow = []

[dependencies]
bootloader_api.workspace = true
os-abi.workspace = true
gfx.workspace = true
boot-data.workspace = true
mm.workspace = true

[lints]
workspace = true
