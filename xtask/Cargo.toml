[package]
name = "xtask"
description = "Host build tool: lint, test, kernel and user-program builds, program bundle, disk image, QEMU launch and boot smoke test, private-file check."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
# Shared with the kernel so the smoke test checks the same markers and colours
# the kernel uses. Both are no_std, dependency-light and build on the host.
boot-data.workspace = true
gfx.workspace = true
# The program bundle format and the ELF checks the kernel's loader uses, so
# a bad user program fails the build instead of the boot.
exec.workspace = true
storage.workspace = true
os-abi.workspace = true
desktop = { path = "../userspace/desktop" }
sha2 = "=0.10.9"

[lints]
workspace = true
