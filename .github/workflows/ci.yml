name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Lint, test, build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo xtask ci

  boot-smoke:
    name: UEFI image and QEMU boot smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf
      - name: Lint image builder
        run: cargo clippy -p image-builder -- -D warnings
      - name: Boot smoke test (all scenarios, including input and user processes)
        # Builds the normal image (with the user-program bundle) and one image
        # per fault-test feature, boots each scenario headless and fails
        # unless the kernel's serial markers (memory, input and scheduler
        # self-tests, fault reports, injected input events, process tests and
        # contained user faults) and the screenshot check succeed within the
        # per-scenario timeout. OVMF is auto-detected.
        run: cargo xtask smoke
      - name: Disposable storage persistence and malformed-volume tests
        run: cargo xtask storage-smoke
      - name: Show serial logs
        if: always()
        run: |
          for log in target/smoke/debug/*/serial.log; do
            echo "== $log"; cat "$log" || true
          done
