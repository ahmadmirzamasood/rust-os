[workspace]
resolver = "3"
members = [
    "kernel",
    "crates/os-abi",
    "crates/gfx",
    "crates/boot-data",
    "crates/mm",
    "crates/input",
    "crates/exec",
    "crates/storage",
    "userspace/desktop",
    "userspace/ulib",
    "userspace/apps",
    "xtask",
    "tools/image-builder",
    "vendor/iced/core",
    "vendor/iced/widget",
]
# Host-testable crates only. The kernel needs `--target x86_64-unknown-none`
# and the image builder compiles the bootloader, so both are driven by xtask.
default-members = [
    "crates/os-abi",
    "crates/gfx",
    "crates/boot-data",
    "crates/mm",
    "crates/input",
    "crates/exec",
    "crates/storage",
    "userspace/desktop",
    "xtask",
    "vendor/iced/core",
    "vendor/iced/widget",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.101"

[workspace.dependencies]
os-abi = { path = "crates/os-abi" }
gfx = { path = "crates/gfx" }
boot-data = { path = "crates/boot-data" }
mm = { path = "crates/mm" }
input = { path = "crates/input" }
exec = { path = "crates/exec" }
storage = { path = "crates/storage" }
ulib = { path = "userspace/ulib" }
iced_core = { path = "vendor/iced/core" }
iced_widget = { path = "vendor/iced/widget" }
# Bitmap glyphs rasterized from Noto Sans Mono. Already compiled into the
# bootloader's UEFI stage; only the sizes and weights we draw are enabled.
noto-sans-mono-bitmap = { version = "=0.2.0", default-features = false, features = [
    "regular",
    "bold",
    "size_16",
    "size_32",
    "unicode-basic-latin",
] }
bootloader_api = "=0.11.17"
bootloader = { version = "=0.11.17", default-features = false, features = ["uefi"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
multiple_unsafe_ops_per_block = "warn"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
debug = true
overflow-checks = true
