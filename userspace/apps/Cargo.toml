[package]
name = "apps"
description = "Project-built user programs packed into the boot bundle: init (process test driver), echo, spin, fault and abuse."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

# Built only by `cargo xtask` for x86_64-unknown-none as static executables
# (see docs/building.md); not part of the host default members.

[[bin]]
name = "init"
test = false
bench = false

[[bin]]
name = "echo"
test = false
bench = false

[[bin]]
name = "spin"
test = false
bench = false

[[bin]]
name = "fault"
test = false
bench = false

[[bin]]
name = "abuse"
test = false
bench = false

[dependencies]
ulib.workspace = true
os-abi.workspace = true

[lints]
workspace = true
